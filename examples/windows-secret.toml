# A workload holding a secret: values are never passed as env vars.
# Run with:  tpt secret set github-token
#           tpt run --manifest examples/windows-secret.toml
#
# The workload does NOT receive the token as an environment variable. It
# receives the `secret:github-token` capability, and the value is released
# only through the capability-gated secret store. `tpt secret list` shows
# names only, never values.

api = "tpt.runtime/v1"

[workload]
name = "windows-secret"

[execution]
backend = "windows"
program = "cmd.exe"
args = ["/C", "echo authenticating"]

[resources]
cpu = 1
memory = "256MiB"
timeout_secs = 60

[network]
mode = "outbound"

[[capabilities]]
name = "secret:github-token"

[[capabilities]]
name = "network.outbound"
