[package]
name = "tpt-runtime-sandbox"
description = "Windows OCI isolation provider: job objects, restricted tokens, bundles (SPEC 13, 17)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["oci", "containers", "isolation", "sandbox", "windows"]
