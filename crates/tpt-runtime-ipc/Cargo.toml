[package]
name = "tpt-runtime-ipc"
description = "IPC primitives: API envelope types and JSON-line framing (SPEC 22, 30)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["ipc", "named-pipes", "ndjson", "framing", "protocol"]
categories = ["network-programming"]

[features]
archon = ["dep:tpt-archon-bridge", "dep:tpt-archon-core"]

[dependencies]
tpt-archon-bridge = { version = "0.1", optional = true }
tpt-archon-core = { version = "0.1", optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tpt-runtime-core = { workspace = true }
