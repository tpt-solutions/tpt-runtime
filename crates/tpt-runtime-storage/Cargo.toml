[package]
name = "tpt-runtime-storage"
description = "Logical volume abstraction backed by host directories (SPEC 15)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["volumes", "storage", "persistence", "host-directories", "filesystem"]
categories = ["filesystem"]

[features]
archon = ["dep:tpt-archon-core"]

[dependencies]
serde = { workspace = true }
tpt-archon-core = { version = "0.1", optional = true }
serde_json = { workspace = true }
tpt-runtime-core = { workspace = true }
tpt-runtime-model = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tpt-runtime-ipc = { workspace = true, features = ["archon"] }
